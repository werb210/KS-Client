# KS_CLIENT_v5_LICENSEE_APPS - builds each licensee's own branded client app (web + iPhone/iPad + Android) from this
# one codebase and uploads it to THAT licensee's App Store Connect and Google Play accounts (Apple guideline 4.2.6:
# every brokerage publishes under its own developer accounts). Started by hand: Actions > "Build licensee apps" >
# Run workflow, licensee = a folder name under licensees/ or "all".
#
# Credentials live in a GitHub Environment named after the licensee key (Settings > Environments > <key>):
#   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8, APPLE_TEAM_ID, IOS_DIST_CERT_P12 (base64),
#   IOS_DIST_CERT_PASSWORD, ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   PLAY_SERVICE_ACCOUNT_JSON; optional GOOGLE_SERVICES_JSON (Firebase, for push) and AZURE_STATIC_WEB_APPS_API_TOKEN
#   (deploys the web build to the licensee's Static Web App).
# Missing secrets never fail the run: the apps are still built and kept as run artifacts, and the upload is skipped
# with a notice. See docs/LICENSEE_APPS.md.
name: Build licensee apps
on:
  workflow_dispatch:
    inputs:
      licensee:
        description: 'Licensee key (folder under licensees/), or "all"'
        required: true
        default: all
      play_track:
        description: Google Play track
        required: false
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      play_status:
        description: 'Google Play release status ("draft" until the app has passed its first review)'
        required: false
        default: draft
        type: choice
        options: [draft, completed]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      licensees: ${{ steps.list.outputs.licensees }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Pick licensees and check their settings
        id: list
        env:
          WANTED: ${{ inputs.licensee }}
        run: |
          node --input-type=module -e '
            import { listLicensees } from "./scripts/licensee/lib.mjs";
            import { appendFileSync } from "node:fs";
            const all = listLicensees();
            const wanted = (process.env.WANTED || "all").trim();
            const keys = wanted === "all" ? all : [wanted];
            const unknown = keys.filter((k) => !all.includes(k));
            if (!keys.length || unknown.length) { console.error("::error::Unknown licensee: " + (unknown.join(", ") || "(none)") + ". Known: " + all.join(", ")); process.exit(1); }
            appendFileSync(process.env.GITHUB_OUTPUT, "licensees=" + JSON.stringify(keys) + "\n");
            console.log("Building: " + keys.join(", "));
          '
      - name: Validate (ids, colour contrast, icon and splash sizes, wording keys)
        env:
          WANTED: ${{ inputs.licensee }}
        run: node scripts/licensee/validate.mjs "$WANTED"

  web:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        licensee: ${{ fromJSON(needs.plan.outputs.licensees) }}
    environment: ${{ matrix.licensee }}
    env:
      VITE_LICENSEE: ${{ matrix.licensee }}
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the web app for ${{ matrix.licensee }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.licensee }}
          path: client-app/dist
          retention-days: 30
      - name: Deploy to the licensee's Static Web App
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          app_location: client-app/dist
          skip_app_build: true
      - name: Deploy skipped
        if: env.SWA_TOKEN == ''
        run: echo "::notice title=${{ matrix.licensee }} web::No AZURE_STATIC_WEB_APPS_API_TOKEN in the '${{ matrix.licensee }}' environment - web build kept as the run artifact web-${{ matrix.licensee }}."

  ios:
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        licensee: ${{ fromJSON(needs.plan.outputs.licensees) }}
    environment: ${{ matrix.licensee }}
    concurrency:
      group: licensee-ios-${{ matrix.licensee }}
      cancel-in-progress: false
    env:
      LICENSEE: ${{ matrix.licensee }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    steps:
      - name: Check the licensee's Apple credentials
        id: creds
        run: |
          missing=""
          for v in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=$LICENSEE iOS::Missing in the '$LICENSEE' environment:$missing - building an unsigned archive only, no App Store Connect upload."
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Use the newest released Xcode (App Store Connect refuses beta builds)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Brand the native project for ${{ matrix.licensee }}
        run: node scripts/brand-native.mjs "$LICENSEE"
      - name: Licensee ids
        run: |
          node --input-type=module -e '
            import { loadLicensee } from "./scripts/licensee/lib.mjs";
            const { config: c } = loadLicensee(process.env.LICENSEE);
            console.log("IOS_BUNDLE_ID=" + c.ios.bundle_id);
            console.log("CAP_APP_ID=" + c.android.application_id);
          ' >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx cap sync ios
        working-directory: client-app
      - name: Verify post-sync iOS release guardrails
        run: python3 scripts/verify-ios-release.py
      - name: Install the signing certificate and App Store Connect key
        if: steps.creds.outputs.upload == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY_ID}.p8"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project client-app/ios/App/App.xcodeproj -scheme App
      - name: Archive (signed with the licensee's team)
        if: steps.creds.outputs.upload == 'true'
        run: >-
          xcodebuild archive
          -project client-app/ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY_ID}.p8"
          -authenticationKeyID "$APPLE_API_KEY_ID"
          -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Automatic
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Upload to the licensee's App Store Connect
        if: steps.creds.outputs.upload == 'true'
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          -exportOptionsPlist client-app/ios/App/ci/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY_ID}.p8"
          -authenticationKeyID "$APPLE_API_KEY_ID"
          -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
      - name: Archive (unsigned - no Apple credentials yet)
        if: steps.creds.outputs.upload != 'true'
        run: >-
          xcodebuild archive
          -project client-app/ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Keep the archive
        run: ditto -c -k --keepParent "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/ios-${LICENSEE}.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.licensee }}
          path: ${{ runner.temp }}/ios-${{ matrix.licensee }}.xcarchive.zip
          retention-days: 30
      - name: Summary
        run: |
          {
            echo "### $LICENSEE - iOS"
            echo "- Bundle id: $IOS_BUNDLE_ID"
            echo "- Build number: $BUILD_NUMBER"
            if [ "${{ steps.creds.outputs.upload }}" = "true" ]; then
              echo "- Uploaded to the licensee's App Store Connect. Apple processes it for 10-30 minutes, then it shows in TestFlight."
            else
              echo "- Not uploaded (Apple credentials missing). Unsigned archive kept as the run artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key and keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  android:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        licensee: ${{ fromJSON(needs.plan.outputs.licensees) }}
    environment: ${{ matrix.licensee }}
    env:
      LICENSEE: ${{ matrix.licensee }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Check the licensee's Google credentials
        id: creds
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=$LICENSEE Android::Missing in the '$LICENSEE' environment:$missing - building an unsigned bundle only, no Google Play upload."
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$missing" ] && [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || echo "::notice title=$LICENSEE Android::No PLAY_SERVICE_ACCOUNT_JSON in the '$LICENSEE' environment - skipping the Google Play upload."
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3
      - run: npm ci
      - name: Brand the native project for ${{ matrix.licensee }}
        run: node scripts/brand-native.mjs "$LICENSEE"
      - name: Licensee ids
        run: |
          node --input-type=module -e '
            import { loadLicensee } from "./scripts/licensee/lib.mjs";
            console.log("ANDROID_APPLICATION_ID=" + loadLicensee(process.env.LICENSEE).config.android.application_id);
          ' >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx cap sync android
        working-directory: client-app
      - name: Verify the Android identity
        run: grep -Fq "applicationId \"$ANDROID_APPLICATION_ID\"" client-app/android/app/build.gradle
      - name: Build the release bundle (AAB)
        run: gradle bundleRelease
        working-directory: client-app/android
      - name: Sign the bundle with the licensee's upload key
        if: steps.creds.outputs.sign == 'true'
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          AAB=client-app/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$AAB" > /dev/null
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Name the bundle
        run: cp client-app/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/android-${LICENSEE}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.licensee }}
          path: ${{ runner.temp }}/android-${{ matrix.licensee }}.aab
          retention-days: 30
      - name: Upload to the licensee's Google Play
        if: steps.creds.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_APPLICATION_ID }}
          releaseFiles: ${{ runner.temp }}/android-${{ matrix.licensee }}.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
      - name: Summary
        run: |
          {
            echo "### $LICENSEE - Android"
            echo "- Application id: $ANDROID_APPLICATION_ID"
            echo "- Signed: ${{ steps.creds.outputs.sign }}; uploaded to Google Play: ${{ steps.creds.outputs.upload }} (track ${{ inputs.play_track }}, ${{ inputs.play_status }})"
          } >> "$GITHUB_STEP_SUMMARY"
