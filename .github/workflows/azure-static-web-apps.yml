name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  # BF_CLIENT_AUDIT_v110 - PRs run the same gates (lint, typecheck, tests,
  # build, artifact checks); only the Deploy step is limited to push on main.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  # KS_LICENSEE_DEPLOY_v1 - by hand, from main only: the development copy and every licensee, or one licensee.
  workflow_dispatch:
    inputs:
      licensee:
        description: >-
          Only this licensee (its code in deploy/licensees.json, e.g. northwind). Empty deploys the development copy
          and every enabled licensee.
        required: false
        default: ''
        type: string

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./client-app

    steps:
      - uses: actions/checkout@v5

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # BF_CLIENT_TEST_REPAIR_v1 - client-app holds 145 test files that no
      # workflow ever ran. They are gated here, before Build, so a red suite
      # blocks the deploy instead of shipping unnoticed.
      # BF_CLIENT_AUDIT_v748 - lint (rules of hooks) was never run.
      - name: Lint
        run: npm run lint   # BF_CLIENT_LINT_STEP_v749 - steps already run inside client-app
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:ci
      - name: Source-grep test budget
        run: node ../scripts/check-source-grep-tests.mjs
      # KS_CLIENT_v5_LICENSEE_APPS - every licensees/<key> folder must be buildable (ids, contrast, icon sizes).
      - name: Validate licensee apps
        run: node ../scripts/licensee/validate.mjs
      # KS_LICENSEE_DEPLOY_v1 - the licensee registry the deploy jobs read must be valid before it reaches main.
      - name: Licensee deploy registry
        run: node ../deploy/licensee-matrix.mjs --check
      # KS_SHARED_HOSTING_v1 - the deploy scripts (registry and publishing to the shared web host) have their own tests.
      - name: Deploy script tests
        working-directory: .
        run: node --test deploy/*.test.mjs

      - name: Build
        run: npm run build
        env:
          # KS_CLIENT_v7_DEMO - the self-serve demo's server (repository variable; empty leaves the demo page off)
          VITE_DEMO_SERVER_URL: ${{ vars.VITE_DEMO_SERVER_URL || 'https://ks-demo-server.azurewebsites.net' }}

      - name: Verify SWA config in artifact (Block 16)
        working-directory: ./client-app
        run: |
          if [ ! -f dist/staticwebapp.config.json ]; then
            echo "::error::dist/staticwebapp.config.json missing - SPA fallback will break (hard reloads will 404)."
            exit 1
          fi
          echo "OK staticwebapp.config.json present in dist/"
          # KS_SHARED_HOSTING_v1 - what a brokerage publish would upload (content types, index.html last); touches nothing.
          node ../deploy/publish-site.mjs client ci-check dist --dry-run

      - name: Check build size
        run: |
          echo "File count:"
          find dist | wc -l
          echo "Total size:"
          du -sh dist

      - name: Deploy (NO ORYX)
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.licensee == ''))
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          app_location: "client-app/dist"
          skip_app_build: true

      # KS_SHARED_APP_BUILD_v1 - the same build, published once for every brokerage (sites/_shared/client/). The shared
      # web host serves it at each brokerage's client app address and tells it the brokerage at /ks-config.js.
      - name: Publish the shared build for every brokerage (sites/_shared/client/)
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.licensee == ''))
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.KS_SITES_STORAGE_CONNECTION_STRING }}
          KS_DOMAIN: ${{ vars.KS_DOMAIN || 'keystonecrm.online' }}
        run: |
          if [ -z "$AZURE_STORAGE_CONNECTION_STRING" ]; then echo "::notice::KS_SITES_STORAGE_CONNECTION_STRING is not set: the shared build was not published"; exit 0; fi
          node ../deploy/shared-csp.mjs dist "$KS_DOMAIN"
          node ../deploy/publish-site.mjs client _shared dist

  # KS_LICENSEE_DEPLOY_v1 + KS_SHARED_HOSTING_v1 - every brokerage's client web app, after the gates above passed.
  # Brokerages no longer get a Static Web App each: their builds are served by the shared web host (ks-shared-web,
  # KS-Ops web-host/), which streams them from the blob container `sites` at <code>/client/. deploy/licensees.json
  # lists the brokerages; each one's build settings live in its GitHub environment (normally ks-<code>,
  # Settings > Environments):
  #   variables VITE_API_BASE_URL                 the brokerage's api host on the shared KS-server (https://...)  required
  #             VITE_LICENSEE                     a licensees/<key> folder: brand, icons, fonts, wording   optional
  #             VITE_CLIENT_APP_URL, VITE_WEBSITE_URL, VITE_SUPPORT_EMAIL, VITE_COMPANY_NAME             optional
  #   secret    KS_SITES_STORAGE_CONNECTION_STRING  the shared storage account (normally a repository secret, the same
  #                                                 for every brokerage)
  # The build is the same as before: it takes the server from VITE_API_BASE_URL instead of client-app/.env.production
  # (and over licensee.json's server_url) and points staticwebapp.config.json's CSP at it; the shared web host applies
  # those headers. The app calls the server at its absolute address (the web host has no /api proxy). The self-serve
  # demo page stays off. deploy/publish-site.mjs uploads dist/ with explicit content types and removes the previous
  # build's leftover files. The iPhone/iPad/Android apps are still built by build-licensee-apps.yml. One brokerage
  # failing never stops the rest.
  licensee-plan:
    needs: build_and_deploy
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      repo_api_base_url: ${{ steps.repo.outputs.api_base_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Licensees to deploy
        id: plan
        env:
          WANTED: ${{ inputs.licensee }}
        run: node deploy/licensee-matrix.mjs client "$WANTED"

      # A brokerage environment without its own value silently gets the repository's (the development copy's): its
      # build would talk to the development server. The repository-level value lets each brokerage job refuse that.
      - name: Repository-level settings (to tell them apart from a licensee's)
        id: repo
        env:
          REPO_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: echo "api_base_url=$REPO_API_BASE_URL" >> "$GITHUB_OUTPUT"

  licensee-deploy:
    name: deploy ${{ matrix.code }}
    needs: licensee-plan
    if: needs.licensee-plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.licensee-plan.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-ks-client-${{ matrix.code }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./client-app
    env:
      CODE: ${{ matrix.code }}
      ENVIRONMENT: ${{ matrix.environment }}
      SITES_CONNECTION: ${{ secrets.KS_SITES_STORAGE_CONNECTION_STRING }}
    steps:
      - name: Check the licensee's settings
        working-directory: .
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          REPO_API_BASE_URL: ${{ needs.licensee-plan.outputs.repo_api_base_url }}
        run: |
          missing=""
          [ -n "$SITES_CONNECTION" ] || missing="$missing secret:KS_SITES_STORAGE_CONNECTION_STRING"
          case "$API_BASE_URL" in
            https://*) [ "$API_BASE_URL" != "$REPO_API_BASE_URL" ] || missing="$missing variable:VITE_API_BASE_URL" ;;
            *) missing="$missing variable:VITE_API_BASE_URL" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error title=$CODE::Add to the GitHub environment '$ENVIRONMENT' (or the repository, for the secret):$missing (an https address for the variable)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # Only values the environment sets are passed on, so the app's own defaults apply otherwise.
      - name: Build settings from the licensee's environment
        working-directory: .
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LICENSEE: ${{ vars.VITE_LICENSEE }}
          VITE_CLIENT_APP_URL: ${{ vars.VITE_CLIENT_APP_URL }}
          VITE_WEBSITE_URL: ${{ vars.VITE_WEBSITE_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_COMPANY_NAME: ${{ vars.VITE_COMPANY_NAME }}
        run: |
          api="${VITE_API_BASE_URL%/}"
          {
            echo "VITE_API_BASE=$api"
            echo "VITE_API_BASE_URL=$api"
            echo "VITE_API_URL=$api"
            for name in VITE_LICENSEE VITE_CLIENT_APP_URL VITE_WEBSITE_URL VITE_SUPPORT_EMAIL VITE_COMPANY_NAME; do
              if [ -n "${!name}" ]; then echo "$name=${!name}"; fi
            done
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # The shared web host applies dist/staticwebapp.config.json's headers (CSP etc.): it must be there and allow the
      # brokerage's server.
      - name: Verify the build points at the licensee's server
        run: |
          host="${VITE_API_BASE_URL#https://}"; host="${host%%/*}"
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/staticwebapp.config.json || { echo "::error::dist/staticwebapp.config.json missing - the web host would serve no CSP"; exit 1; }
          grep -q "$host" dist/staticwebapp.config.json || { echo "::error::dist/staticwebapp.config.json does not name $host"; exit 1; }
          grep -rqF "$VITE_API_BASE_URL" dist/assets || { echo "::error::the bundle does not contain $VITE_API_BASE_URL"; exit 1; }

      - name: Publish to the shared web host (sites/${{ matrix.code }}/client/)
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.KS_SITES_STORAGE_CONNECTION_STRING }}
        run: node ../deploy/publish-site.mjs client "$CODE" dist
